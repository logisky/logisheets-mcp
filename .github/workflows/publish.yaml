name: Publish

on:
  push:
    tags: ['v*']
  # Lets a release be re-run, and lets a version that is already on npm be
  # registered without one. Both matter because the two publishes below are
  # not a transaction: npm can succeed and the registry step still fail.
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # OIDC, for both the MCP Registry login and npm provenance. No token
      # needed for the registry — the workflow's own identity proves the
      # io.github.logisky namespace.
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v6

      # Shaped after npm's own trusted-publishing example, deliberately: Node 24
      # because OIDC needs Node 22.14+ AND npm 11.5.1+, and 24 is the first line
      # whose BUNDLED npm clears that on its own. Node 20 failed with ENEEDAUTH
      # (npm 10 has no OIDC path at all) and Node 22 ships a 10.x too.
      #
      # `package-manager-cache: false` is from the same example — npm says not to
      # cache in a release build, and a restored cache is the one input to a
      # publish that did not come from this commit.
      # NO `registry-url`, and that is the whole fix. Given one, `setup-node`
      # writes an `.npmrc` holding `_authToken=${NODE_AUTH_TOKEN}` and exports
      # NODE_AUTH_TOKEN as the placeholder `XXXXX-XXXXX-XXXXX-XXXXX` so that
      # line stays valid. npm then sees a credential already configured, uses
      # it instead of asking for an OIDC token, and the registry refuses the
      # nonsense — as E404 on PUT, which reads like "no such package" and is
      # really "not you". registry.npmjs.org is npm's default anyway, so the
      # input bought nothing and cost the entire trusted-publishing path.
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      # What the last failure could not tell us. It reported E404 on PUT with no
      # mention of OIDC anywhere in the log, which has two very different causes
      # — an npm too old to try, or an npm that tried and was refused — and the
      # log did not say which. Print the version, and whether setup-node left an
      # auth line in .npmrc, so the next run is diagnosable from its own output.
      - name: Show what will publish
        run: |
          echo "node $(node --version), npm $(npm --version)"
          echo "OIDC request URL present: ${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}${ACTIONS_ID_TOKEN_REQUEST_URL:-no}"
          echo "NODE_AUTH_TOKEN set: ${NODE_AUTH_TOKEN:+yes}${NODE_AUTH_TOKEN:-no}"
          for f in ~/.npmrc ./.npmrc "${NPM_CONFIG_USERCONFIG:-/nonexistent}"; do
            if [ -f "$f" ]; then
              echo "--- $f"
              sed 's/=.*/=<redacted>/' "$f"
            else
              echo "--- $f (absent)"
            fi
          done

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      # A tag names the version; a manual run takes package.json's word for it.
      - name: Resolve the release
        id: release
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="${GITHUB_REF#refs/tags/}"
            version="${version#v}"
          else
            version="$(node -p 'require("./package.json").version')"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "name=$(node -p 'require("./package.json").name')" >> "$GITHUB_OUTPUT"
          echo "Releasing $version"

      # Before anything irreversible. Holds package.json, both version fields
      # in server.json, and the mcpName ↔ server name pair to that version.
      - name: Check the release is coherent
        run: node scripts/check-release.mjs "${{ steps.release.outputs.version }}"

      # Skipped when that exact version is already on npm, so the job can be
      # re-run after a failure further down without dying here on E403.
      #
      # No token: the package is configured as a trusted publisher on npm, so
      # this workflow's own OIDC identity is the credential — which is what the
      # `id-token: write` permission above is for. Provenance is generated
      # automatically on that path, so `--provenance` is not passed; asking for
      # it explicitly would only duplicate what npm already does.
      #
      # If npm's trusted-publisher settings ever name an ENVIRONMENT, this job
      # has to declare the same one (`environment: <name>`) or the identity will
      # not match. It names none today, so neither does this.
      - name: Publish to npm
        run: |
          spec="${{ steps.release.outputs.name }}@${{ steps.release.outputs.version }}"
          if npm view "$spec" version >/dev/null 2>&1; then
            echo "$spec is already on npm — skipping publish"
          else
            npm publish
          fi

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to the MCP Registry
        run: ./mcp-publisher login github-oidc

      # Has to come after npm: the registry fetches the package to check its
      # mcpName, so the version must already exist there.
      - name: Publish to the MCP Registry
        run: ./mcp-publisher publish
